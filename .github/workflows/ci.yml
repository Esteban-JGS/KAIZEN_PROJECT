name: CI

on:
  push:
    branches: [ main, base ]
  pull_request:
    branches: [ main, base ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: KaizenLang

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: KaizenLang/global.json
    - name: Restore
      run: dotnet restore KaizenLang.sln
    # La solución incluye la app, las herramientas de tools/, los tests y el playground web.
    - name: Build
      run: dotnet build KaizenLang.sln -c Release --no-restore
    - name: Test
      run: dotnet test KaizenLang.sln -c Release --no-build
